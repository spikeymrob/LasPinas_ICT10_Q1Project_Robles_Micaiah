<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Calculator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css"/>
  <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

  <!-- Bootstrap CSS -->

<link

href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"

rel="stylesheet"

>


<style>

body {

background: linear-gradient(135deg, #000000, #ff2a00);

min-height: 100vh;

font-family: Arial, sans-serif;

}


.container {

padding-top: 50px;

padding-bottom: 50px;

}


.main-card {

border: none;

border-radius: 20px;

overflow: hidden;

box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);

}


.header {

background: #212529;

color: white;

padding: 30px;

text-align: center;

}


.info-card {

border: none;

border-radius: 15px;

height: 100%;

transition: transform 0.2s;

}


.info-card:hover {

transform: translateY(-5px);

}


.info-title {

color: #016f31;

font-weight: bold;

}


.data-value {

font-size: 1.1rem;

}


.badge-custom {

background-color: #f9f6f6;

}


footer {

text-align: center;

color: white;

margin-top: 30px;

}

</style>


</head>
<body class="bg-light py-5">

  <div class="container col-md-6">
    <div class="card shadow-sm">
      <div class="card-header bg-success text-white d-flex justify-content-between align-items-center">
        <h4 class="card-title mb-0">Create Order</h4>
        <!-- Link to SKU Generator -->
        <a href="SKU.html" class="btn btn-light btn-sm fw-semibold">&larr; Go to SKU Generator</a>
      </div>
      <div class="card-body">
        <p class="fw-bold mb-2">Select Items:</p>
        
        <div class="form-check mb-2">
          <input class="form-check-input" type="checkbox" id="Juturna" value="900.00">
          <label class="form-check-label" for="item1">Juturna - Circa Survive (₱900)</label>
        </div>
        <div class="form-check mb-2">
          <input class="form-check-input" type="checkbox" id="AWKIF" value="900.00">
          <label class="form-check-label" for="item2">All We Know Is Falling - Paramore (₱900) </label>
        </div>
        <div class="form-check mb-2">
          <input class="form-check-input" type="checkbox" id="U" value="1000.00">
          <label class="form-check-label" for="item3">U - underscores (₱1000)</label>
        </div>
        <div class="form-check mb-2">
          <input class="form-check-input" type="checkbox" id="Wallsocket" value="900.00">
          <label class="form-check-label" for="item4">Wallsocket - underscores (₱900)</label>
        </div>
        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" id="BULLETS" value="1500.00">
          <label class="form-check-label" for="item5"> I Brought You My Bullets, You Brought Me Your Love - MCR (₱1500.00)</label>
        </div>

        <button class="btn btn-success w-100" py-click="create_order">Calculate Order</button>
        
        <div class="mt-3">
          <pre class="bg-dark text-light p-3 rounded" id="show">Receipt details will appear here...</pre>
        </div>
      </div>
    </div>
  </div>

  <script type="py">
  
        
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
