<!DOCTYPE html>
<html lang="en">
<meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SKU Generator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css"/>
  <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
</head>
<body class="bg-light py-5">

  <div class="container col-md-6">
    <div class="card shadow-sm">
      <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
        <h4 class="card-title mb-0">SKU Generator</h4>
        <!-- Link to Order Calculator -->
        <a href="index.html" class="btn btn-light btn-sm fw-semibold">Go to Receipt/Order Calculator &rarr;</a>
      </div>
      <div class="card-body">
        <div class="mb-3">
          <label for="category" class="form-label">Category</label>
          <input type="text" id="category" class="form-control" placeholder="e.g., Electronics">
        </div>
        <div class="mb-3">
          <label for="product_name" class="form-label">Product Name</label>
          <input type="text" id="product_name" class="form-control" placeholder="e.g., Keyboard">
        </div>
        <div class="mb-3">
          <label for="quantity" class="form-label">Quantity</label>
          <input type="number" id="quantity" class="form-control" placeholder="e.g., 50">
        </div>
        <button class="btn btn-primary w-100" py-click="SKU_generator">Generate SKU</button>
        
        <div class="mt-3 alert alert-info" id="sku_output">
          SKU will appear here...
        </div>
      </div>
    </div>
  </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
